<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="LoginStyle.css">
  
    <link rel="stylesheet" href="Responsiveness/Mobile414_Responsive.css">
</head>
<body>
    <div class="login-container"><br>
        <div id="login-image-box">
            <!-- <img src="Login Page/Logo.png" alt="Logo"> -->
        </div>

        <h1 id="login-text">Login</h1>

        <input type="email" name="email" id="email" placeholder="Email" class="input"><br>

        <input type="password" name="password" id="password" placeholder="Password" class="input"><br>
        
        <a href="#" id="forgot-password">Forgot password?</a><br>

        <button id="llogin-btn">Login</button><br>

        <p id="no-account">Don't have an account?</p>

        <a href="SignUp.html" id="sign-up">Sign Up</a>
    </div>    
</body>
</html>
