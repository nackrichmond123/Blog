<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="SignUp.css">
    <link rel="stylesheet" href="Responsiveness/Mobile414_Responsive.css">
</head>
<body>
    <div class="signup-container"><br>
        <div id="signup-image-box">
            <!-- <img src="Login Page/Logo.png" alt="Logo"> -->
        </div>

        <h1 id="sign-up">SignUp</h1>

        <input type="text" name="username" id="username" placeholder="Username" class="input"><br>

        <input type="email" name="email" id="email" placeholder="Email" class="input"><br>

        <input type="password" name="password" id="password" placeholder="Password" class="input"><br>

        <input type="password" name="c-password" id="c-password" placeholder="Confirm password" class="input"><br>

        <button id="sign-up-btn">SignUp</button><br>

        <p id="has-account">Already have an account?</p>

        <a href="Login.html" id="login">Login</a>
    </div>     
</body>
</html>
